# ops/nginx/cnotes.prod.conf
# 生产同源反代:静态 dist + /api 反代到本机 8080。由 install.sh 替换 __SERVER_NAME__/__LISTEN_PORT__
# 后落到 /etc/nginx/conf.d/cnotes.conf。有域名后可把 __SERVER_NAME__ 手工改成真实域名,并按需加
# 443 + ssl_certificate(证书就绪后)。__LISTEN_PORT__ 默认 80;云主机 80/443 常受安全组/ICP 限制时,
# 用 install.sh 的 LISTEN_PORT 环境变量换成自定义端口(如 38088)。
server {
    listen __LISTEN_PORT__;
    server_name __SERVER_NAME__;

    root /var/www/cnotes/dist;
    index index.html;

    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 深聊一轮可能等 LLM,放宽超时
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA history 路由回退
    }
}
