# cnotes 本地同源反代（开发/联调用）。
#
# 目的：让前端 SPA 与后端 API 同源，前端无需 CORS、cookie 同站，贴近生产反代形态。
#   - `/`        → 提供 web 生产构建产物（frontend/apps/web/dist 的单页应用，history 路由回退 index.html）
#   - `/api/`    → 反代到后端 Spring Boot（Tomcat 127.0.0.1:8080）
#
# 运行（以仓库根为 prefix，使配置内相对路径生效、且不依赖具体机器路径）：
#   nginx -p /绝对路径/c-notes/ -c ops/nginx/cnotes.dev.conf        # 启动
#   nginx -p /绝对路径/c-notes/ -c ops/nginx/cnotes.dev.conf -t     # 仅校验配置
#   nginx -p /绝对路径/c-notes/ -c ops/nginx/cnotes.dev.conf -s stop # 停止
#
# 监听 8088（避开后端的 8080）。运行期文件（pid/日志/临时目录）落到 .data/nginx/（已被 .gitignore 忽略）。
# 生产环境改为 listen 80/443 + 真实证书，root 指向部署目录即可，location 规则不变。

worker_processes  1;
pid               .data/nginx/nginx.pid;
error_log         .data/nginx/error.log  warn;

events {
    worker_connections  256;
}

http {
    # 内联最小 MIME 映射，避免依赖 brew/apt 的 mime.types 绝对路径，保持配置可移植。
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/gif                             gif;
        image/x-icon                          ico;
        image/webp                            webp;
        font/woff                             woff;
        font/woff2                            woff2;
        text/plain                            txt;
    }
    default_type  application/octet-stream;

    access_log    .data/nginx/access.log;

    # 临时目录同样落到 .data/nginx/，免 sudo、可复现。
    client_body_temp_path  .data/nginx/client_body_temp;
    proxy_temp_path        .data/nginx/proxy_temp;
    fastcgi_temp_path      .data/nginx/fastcgi_temp;
    uwsgi_temp_path        .data/nginx/uwsgi_temp;
    scgi_temp_path         .data/nginx/scgi_temp;

    sendfile      on;
    server_tokens off;

    server {
        listen       8088;
        server_name  localhost;

        # SPA 静态产物；root 相对 prefix（仓库根）解析。
        root  frontend/apps/web/dist;
        index index.html;

        # API 反代到后端。保留前缀 /api，后端按 /api/** 暴露。
        location /api/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;   # 深聊一轮可能等 LLM，放宽超时
        }

        # 单页应用 history 路由回退：静态资源命中即返回，否则交给 index.html。
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
