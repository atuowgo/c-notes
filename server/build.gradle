plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cnotes'
version = '0.0.1-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

ext {
    set('springAiVersion', '2.0.0')
    set('mybatisPlusVersion', '3.5.16')
}

// 全局排除默认的 Logback(spring-boot-starter-logging),换用 Log4j2(见下方 starter-log4j2 +
// log4j2.xml)。官方推荐的 Gradle 切换方式:所有 starter 都传递依赖 starter-logging,必须在
// configurations 级别统一排除,单个 dependency 上排除不够(其他 starter 仍会带进 logback)。
configurations {
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // JWT:jjwt 0.12.x API 编译期可见;impl/jackson 仅运行期(签名/校验实现)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation "com.baomidou:mybatis-plus-spring-boot4-starter:${mybatisPlusVersion}"
    implementation "com.baomidou:mybatis-plus-jsqlparser:${mybatisPlusVersion}"   // 3.5.9+ 分页拦截器依赖 jsqlparser(已从核心拆出)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-vector-store'   // SimpleVectorStore(本地文件型,知识网向量检索)
    implementation 'org.jsoup:jsoup:1.18.3'   // 服务端正文抓取/提取(裸 URL、微信公众号)
    implementation 'com.microsoft.playwright:playwright:1.49.0'   // 无头浏览器渲染(动态页兜底,默认关闭)
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') { useJUnitPlatform() }

// 固定产物文件名(不随版本号变化),部署脚本/文档按此名引用,避免版本号漂移导致路径失配。
tasks.named('bootJar') {
    archiveFileName = 'cnotes.jar'
}
