spring:
  datasource:
    url: jdbc:h2:mem:cnotes;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration/{vendor}
  ai:
    openai:
      api-key: test-dummy

worker:
  scheduling:
    enabled: false   # 测试环境关闭定时轮询,防止后台 Worker 污染全表断言
