<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识炼金炉 · 收件箱</title>
<style>
  :root{
    --bg:#f6f4f0; --surface:#ffffff;
    --ink:#23201c; --ink-soft:#6b6359; --ink-faint:#9a9186;
    --line:#e7e2d9; --gold:#b45309; --gold-soft:#f2e6d2;
    --green:#3f7d4e; --red:#b3402e;
    --radius:14px;
    --shadow:0 1px 2px rgba(40,33,22,.04), 0 6px 20px rgba(40,33,22,.05);
    --maxw:760px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}

  /* 顶栏 */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(246,244,240,.86);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:var(--maxw);margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:.3px}
  .brand .mark{width:26px;height:26px;border-radius:8px;flex:none;
    background:linear-gradient(150deg,var(--gold),#e0a050);display:grid;place-items:center;color:#fff;font-size:15px;
    box-shadow:0 2px 6px rgba(180,83,9,.35)}
  .brand small{font-weight:500;color:var(--ink-faint);font-size:12px;margin-left:2px}
  .spacer{flex:1}
  .icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;
    width:34px;height:34px;display:grid;place-items:center;color:var(--ink-soft);font-size:15px}
  .icon-btn:hover{border-color:var(--gold);color:var(--gold)}
  .add-btn{border:1px solid var(--gold);background:var(--gold);color:#fff;border-radius:9px;
    height:34px;padding:0 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .add-btn:hover{filter:brightness(1.05)}

  /* 收件箱 */
  .feed{max-width:var(--maxw);margin:0 auto;padding:18px 20px 80px;display:none}
  .feed.show{display:block}
  .day-label{font-size:12px;color:var(--ink-faint);font-weight:600;letter-spacing:.5px;margin:6px 4px 12px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:17px 18px;margin-bottom:12px;box-shadow:var(--shadow);transition:.18s;position:relative}
  .card[data-clickable="1"]{cursor:pointer}
  .card[data-clickable="1"]:hover{transform:translateY(-1px);border-color:#dccfb8;
    box-shadow:0 2px 4px rgba(40,33,22,.05),0 10px 28px rgba(40,33,22,.07)}
  .card.read{opacity:.62}
  .card.read .c-title{color:var(--ink-soft)}

  .c-head{display:flex;align-items:flex-start;gap:12px}
  .c-title{font-size:17px;font-weight:650;line-height:1.45;margin:0;flex:1;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .c-meta{font-size:12.5px;color:var(--ink-faint);margin:7px 0 0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .c-meta .src{color:var(--gold);font-weight:600}
  .c-summary{font-size:14.5px;color:var(--ink-soft);margin:10px 0 0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .badge{flex:none;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;display:flex;align-items:center;gap:5px}
  .badge.ok{color:var(--green);background:#eaf3ec}
  .badge.proc{color:var(--gold);background:var(--gold-soft)}
  .badge.fail{color:var(--red);background:#f7e9e6}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge.proc .dot{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

  .sk{background:linear-gradient(90deg,#eee9e0 25%,#f4f0e9 37%,#eee9e0 63%);
    background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:6px}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .sk-line{height:13px;margin-top:9px}

  .empty{text-align:center;color:var(--ink-faint);font-size:14px;padding:60px 24px;line-height:1.9}
  .hint{max-width:var(--maxw);margin:0 auto;font-size:12px;color:var(--ink-faint);text-align:center;padding-top:8px}

  /* 阅读页 */
  .reader{display:none;max-width:var(--maxw);margin:0 auto;padding:8px 20px 100px}
  .reader.show{display:block}
  .back{display:inline-flex;align-items:center;gap:7px;margin:18px 0 6px;color:var(--ink-soft);
    font-size:14px;background:none;border:none;padding:0}
  .back:hover{color:var(--gold)}
  .r-title{font-size:27px;font-weight:750;line-height:1.35;margin:14px 0 12px;letter-spacing:.2px}
  .r-meta{font-size:13px;color:var(--ink-faint);display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    padding-bottom:18px;border-bottom:1px solid var(--line)}
  .r-meta .src{color:var(--gold);font-weight:600}

  .distill{background:linear-gradient(180deg,#fffdf8,#fbf6ec);border:1px solid #ecdcc0;
    border-radius:var(--radius);padding:18px 20px;margin:22px 0 6px}
  .distill h4{margin:0 0 8px;font-size:12.5px;letter-spacing:1px;color:var(--gold);
    text-transform:uppercase;display:flex;align-items:center;gap:7px}
  .distill .summary{font-size:15px;color:var(--ink);margin:0 0 14px;line-height:1.7}
  .distill ul{margin:0;padding-left:18px}
  .distill li{font-size:14px;color:var(--ink-soft);margin:6px 0;line-height:1.6}
  .distill.waiting{background:#f3efe7;border-color:var(--line)}
  .distill.waiting h4{color:var(--ink-soft)}
  .distill .wait-text{font-size:14px;color:var(--ink-soft);margin:0}

  .r-body{font-size:16.5px;line-height:1.85;color:#33302a;margin-top:26px;white-space:pre-wrap}
  .r-body p{margin:0 0 19px}

  /* 简易弹窗(收藏) */
  .modal{position:fixed;inset:0;z-index:80;background:rgba(40,33,22,.32);display:none;align-items:center;justify-content:center;padding:20px}
  .modal.show{display:flex}
  .modal-box{background:var(--surface);border-radius:16px;width:min(440px,100%);padding:20px;box-shadow:0 20px 60px rgba(40,33,22,.28)}
  .modal-box h3{margin:0 0 4px;font-size:17px}
  .modal-box p{margin:0 0 14px;font-size:12.5px;color:var(--ink-faint)}
  .modal-box label{display:block;font-size:12.5px;color:var(--ink-soft);font-weight:600;margin:10px 0 5px}
  .modal-box input,.modal-box textarea{width:100%;border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;font-family:inherit;font-size:14px;outline:none}
  .modal-box input:focus,.modal-box textarea:focus{border-color:var(--gold)}
  .modal-box textarea{resize:vertical;min-height:70px;line-height:1.5}
  .modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
  .modal-actions button{border-radius:9px;padding:8px 16px;font-size:13.5px;font-weight:600;border:1px solid var(--line)}
  .modal-actions .cancel{background:#fff;color:var(--ink-soft)}
  .modal-actions .save{background:var(--gold);color:#fff;border-color:var(--gold)}
  .modal-actions .save:disabled{opacity:.5;cursor:default}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:90;
    background:#23201c;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:.22s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="mark">⚗</span> 知识炼金炉 <small>收件箱</small></div>
    <div class="spacer"></div>
    <button class="add-btn" onclick="openCollect()">＋ 收藏链接</button>
    <button class="icon-btn" title="刷新" onclick="loadInbox()">⟳</button>
  </div>
</div>

<div class="feed show" id="feed">
  <div class="day-label">收件箱</div>
  <div id="feedList"><div class="empty">加载中…</div></div>
  <p class="hint" id="feedHint" style="display:none">— 没有更多了。收藏的内容会自动出现在这里 —</p>
</div>

<div class="reader" id="reader">
  <button class="back" onclick="closeReader()">← 返回收件箱</button>
  <h1 class="r-title" id="rTitle"></h1>
  <div class="r-meta" id="rMeta"></div>
  <div id="rDistill"></div>
  <div class="r-body" id="rBody"></div>
</div>

<!-- 收藏弹窗 -->
<div class="modal" id="collectModal">
  <div class="modal-box">
    <h3>收藏一个链接</h3>
    <p>先入库,后台会自动抓取并沉淀。只有 URL 是必填的。</p>
    <label>链接 URL *</label>
    <input id="mUrl" type="url" placeholder="https://…" oninput="syncSave()">
    <label>标题(可选)</label>
    <input id="mTitle" type="text" placeholder="留空则由后台解析">
    <label>正文 / 备注(可选)</label>
    <textarea id="mContent" placeholder="可粘贴正文,便于离线演示沉淀"></textarea>
    <div class="modal-actions">
      <button class="cancel" onclick="closeCollect()">取消</button>
      <button class="save" id="mSave" onclick="submitCollect()" disabled>收藏</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SRC = { browser:'浏览器', wechat:'公众号' };
  const STATE = {
    done:    {cls:'ok',   label:'已就绪'},
    pending: {cls:'proc', label:'处理中'},
    processing:{cls:'proc', label:'处理中'},
    failed:  {cls:'fail', label:'失败'},
  };

  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>(
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function relTime(iso){
    if(!iso) return '';
    const t = new Date(iso); if(isNaN(t)) return '';
    const diff = (Date.now() - t.getTime())/1000;
    if(diff < 60) return '刚刚';
    if(diff < 3600) return Math.floor(diff/60)+' 分钟前';
    if(diff < 86400) return Math.floor(diff/3600)+' 小时前';
    if(diff < 86400*7) return Math.floor(diff/86400)+' 天前';
    return t.toLocaleDateString('zh-CN');
  }

  async function loadInbox(){
    const list = document.getElementById('feedList');
    const hint = document.getElementById('feedHint');
    try{
      const res = await fetch('/api/articles');
      if(!res.ok) throw new Error('HTTP '+res.status);
      const items = await res.json();
      if(!items.length){
        list.innerHTML = '<div class="empty">收件箱还是空的。<br>点右上角「＋ 收藏链接」加一篇试试。</div>';
        hint.style.display = 'none';
        return;
      }
      list.innerHTML = items.map(card).join('');
      hint.style.display = 'block';
    }catch(e){
      list.innerHTML = '<div class="empty">加载失败:'+esc(e.message)+'<br>请确认后端已启动。</div>';
      hint.style.display = 'none';
    }
  }

  function card(a){
    const st = STATE[a.status] || {cls:'proc',label:a.status||'处理中'};
    const ready = a.status === 'done';
    const src = SRC[a.sourceType] || a.sourceType || '浏览器';
    const metaBits = ['<span class="src">'+esc(src)+'</span>'];
    if(a.author) metaBits.push('<span>·</span><span>'+esc(a.author)+'</span>');
    if(a.createTime) metaBits.push('<span>·</span><span>'+esc(relTime(a.createTime))+'</span>');

    let mid;
    if(a.status === 'processing' || a.status === 'pending'){
      mid = '<div class="sk sk-line" style="width:92%"></div><div class="sk sk-line" style="width:78%"></div>';
    } else if(a.status === 'failed'){
      mid = '<p class="c-summary" style="color:var(--red)">'+esc(a.summary || '正文提取失败,稍后可重试。')+'</p>';
    } else {
      mid = '<p class="c-summary">'+esc(a.summary || '(无摘要)')+'</p>';
    }

    return `<div class="card" data-state="${st.cls}" ${ready?`data-clickable="1" onclick="openReader('${esc(a.id)}', this)"`:''}>
      <div class="c-head">
        <h3 class="c-title">${esc(a.title || '(未命名)')}</h3>
        <span class="badge ${st.cls}"><span class="dot"></span>${esc(st.label)}</span>
      </div>
      <div class="c-meta">${metaBits.join('')}</div>
      ${mid}
    </div>`;
  }

  async function openReader(id, el){
    try{
      const res = await fetch('/api/articles/'+encodeURIComponent(id));
      if(res.status === 404){ toast('文章不存在'); return; }
      if(!res.ok) throw new Error('HTTP '+res.status);
      const a = await res.json();
      if(el) el.classList.add('read');

      document.getElementById('rTitle').textContent = a.title || '(未命名)';
      const src = SRC[a.sourceType] || a.sourceType || '浏览器';
      const meta = ['<span class="src">'+esc(src)+'</span>'];
      if(a.author) meta.push('<span>·</span><span>'+esc(a.author)+'</span>');
      document.getElementById('rMeta').innerHTML = meta.join('');

      const distill = document.getElementById('rDistill');
      if(a.status === 'done' && (a.summary || (a.keyPoints||[]).length)){
        const pts = (a.keyPoints||[]).map(p=>'<li>'+esc(p)+'</li>').join('');
        distill.innerHTML = `<div class="distill"><h4>⚗ 自动沉淀</h4>
          ${a.summary?`<p class="summary">${esc(a.summary)}</p>`:''}
          ${pts?`<ul>${pts}</ul>`:''}</div>`;
      } else {
        distill.innerHTML = `<div class="distill waiting"><h4>⚗ 自动沉淀</h4>
          <p class="wait-text">沉淀尚未生成(当前状态:${esc(a.status)})。后台处理完成后会出现摘要与要点。</p></div>`;
      }

      document.getElementById('rBody').textContent = a.content || '(无正文)';
      document.getElementById('feed').classList.remove('show');
      document.getElementById('reader').classList.add('show');
      window.scrollTo(0,0);
    }catch(e){ toast('打开失败:'+e.message); }
  }
  function closeReader(){
    document.getElementById('reader').classList.remove('show');
    document.getElementById('feed').classList.add('show');
    window.scrollTo(0,0);
  }

  /* 收藏 */
  function openCollect(){ document.getElementById('collectModal').classList.add('show');
    document.getElementById('mUrl').focus(); }
  function closeCollect(){ document.getElementById('collectModal').classList.remove('show');
    ['mUrl','mTitle','mContent'].forEach(id=>document.getElementById(id).value=''); syncSave(); }
  function syncSave(){ document.getElementById('mSave').disabled =
    !document.getElementById('mUrl').value.trim(); }

  async function submitCollect(){
    const url = document.getElementById('mUrl').value.trim();
    if(!url) return;
    const payload = { url,
      title: document.getElementById('mTitle').value.trim() || null,
      content: document.getElementById('mContent').value.trim() || null };
    const btn = document.getElementById('mSave'); btn.disabled = true; btn.textContent = '收藏中…';
    try{
      const res = await fetch('/api/collect', {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      const data = await res.json().catch(()=>({}));
      if(!res.ok){ toast(data.message || ('收藏失败 HTTP '+res.status)); return; }
      closeCollect(); toast('已收藏,后台开始处理'); loadInbox();
    }catch(e){ toast('收藏失败:'+e.message); }
    finally{ btn.textContent = '收藏'; btn.disabled = false; }
  }

  let toastTimer;
  function toast(msg){
    const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
  }

  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeCollect();
    if(document.getElementById('reader').classList.contains('show')) closeReader(); }});

  loadInbox();
</script>
</body>
</html>
