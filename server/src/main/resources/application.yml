spring:
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: true
  datasource:
    url: jdbc:mysql://localhost:3306/cnotes?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  ai:
    # 关掉 openai 的 embedding 自动配置:DeepSeek 不提供 embedding,向量统一走火山引擎 Ark
    # 的 ArkEmbeddingModel(@Primary)。仅保留 openai 的 chat 自动配置给 DeepSeek 对话用。
    model:
      embedding: none
    openai:
      # DeepSeek 走 OpenAI 兼容协议:换 base-url + 模型即可,代码(ChatClient)不变。
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}      # 密钥仅来自环境变量,严禁写入仓库
      chat:
        options:
          model: ${LLM_MODEL:deepseek-v4-flash}
# 火山引擎 Ark 多模态 embedding(ArkEmbeddingProperties 绑定);密钥仅来自环境变量。
ark:
  embedding:
    base-url: ${ARK_EMBEDDING_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    api-key: ${ARK_API_KEY:}
    model: ${ARK_EMBEDDING_MODEL:ep-20260617000458-2mslf}
    dim: ${ARK_EMBEDDING_DIM:2048}
mybatis-plus:
  global-config:
    db-config:
      id-type: assign_uuid
  configuration:
    map-underscore-to-camel-case: true
worker:
  poll-interval-ms: 5000
  max-retry: 5
  backoff-base-seconds: 30
wechat:
  # 公众号「服务器配置」的 Token(明文/兼容模式);仅来自环境变量,严禁写入仓库。
  token: ${WECHAT_TOKEN:}
  welcome-reply: "已收下,正在自动整理 ✅ 处理完可在阅读端查看。"
plaza:
  # 精品广场质量分权重(可调):质量分 = 行为分 + AI深度分,发现流再乘新鲜度衰减。
  # 冷启动期可调高 ai-weight、调低行为权重,避免排序全靠零星互动。
  score:
    collect: ${PLAZA_W_COLLECT:3}        # 收录权重
    bookmark: ${PLAZA_W_BOOKMARK:2}      # 收藏权重
    like: ${PLAZA_W_LIKE:2}              # 点赞权重(阶段 4 启用,暂恒 0)
    comment: ${PLAZA_W_COMMENT:1}        # 评论权重(阶段 4 启用,暂恒 0)
    degree: ${PLAZA_W_DEGREE:1}          # 知识网连通度(article_relation 度数)权重
    ai-weight: ${PLAZA_AI_WEIGHT:1.0}    # AI 深度分整体系数
    freshness-halflife-days: ${PLAZA_FRESHNESS_HALFLIFE:7}  # 新鲜度半衰期(天)
    candidate-cap: ${PLAZA_CANDIDATE_CAP:500}               # 候选池上限(按最新截取后在内存算分排序)

extract:
  # HTTP 抓取正文不足此长度则尝试无头渲染兜底。
  min-content-length: 200
  headless:
    # 默认关闭;开启需安装 Chromium(npx playwright install chromium 或 Playwright CLI)。
    enabled: ${HEADLESS_ENABLED:false}
    timeout-ms: 20000
auth:
  # 多用户阶段 1:会话 JWT(HS256)。密钥仅来自环境变量,严禁写入仓库;生产必须覆盖。
  jwt:
    secret: ${AUTH_JWT_SECRET:dev-only-insecure-secret-change-me-in-prod}
  # 本地/测试登录开关:生产务必置 false(经 AUTH_DEV_LOGIN=false)。
  dev-login:
    enabled: ${AUTH_DEV_LOGIN:true}
  # 三方回调后跳回的前端地址。
  frontend-url: ${AUTH_FRONTEND_URL:/}
  # 三方授权 client 凭据:仅来自环境变量,严禁写入仓库;未配置则对应渠道登录入口返回 503。
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_REDIRECT_URI:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
    wechat:
      app-id: ${WECHAT_OAUTH_APPID:}
      app-secret: ${WECHAT_OAUTH_SECRET:}
      redirect-uri: ${WECHAT_OAUTH_REDIRECT_URI:}
