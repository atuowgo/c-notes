spring:
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: true
  datasource:
    url: jdbc:mysql://localhost:3306/cnotes?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  ai:
    # 关掉 openai 的 embedding 自动配置:DeepSeek 不提供 embedding,向量统一走火山引擎 Ark
    # 的 ArkEmbeddingModel(@Primary)。仅保留 openai 的 chat 自动配置给 DeepSeek 对话用。
    model:
      embedding: none
    openai:
      # DeepSeek 走 OpenAI 兼容协议:换 base-url + 模型即可,代码(ChatClient)不变。
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}      # 密钥仅来自环境变量,严禁写入仓库
      chat:
        options:
          model: ${LLM_MODEL:deepseek-v4-flash}
# 火山引擎 Ark 多模态 embedding(ArkEmbeddingProperties 绑定);密钥仅来自环境变量。
ark:
  embedding:
    base-url: ${ARK_EMBEDDING_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    api-key: ${ARK_API_KEY:}
    model: ${ARK_EMBEDDING_MODEL:ep-20260617000458-2mslf}
    dim: ${ARK_EMBEDDING_DIM:2048}
mybatis-plus:
  global-config:
    db-config:
      id-type: assign_uuid
  configuration:
    map-underscore-to-camel-case: true
# JWT 鉴权(A1):secret 仅来自环境变量,默认值仅供本地 dev(>=256bit);expiry 为 ISO-8601 时长。
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-please-use-a-long-random-string-32+}
  expiry: ${JWT_EXPIRY:PT1h}
cnotes:
  security:
    # true=启用 JWT 鉴权(生产);false=全放行(测试 profile 复用现有用例,无需逐条 mock 鉴权)。
    enabled: ${CNOTES_SECURITY_ENABLED:true}
worker:
  poll-interval-ms: 5000
  max-retry: 5
  backoff-base-seconds: 30
wechat:
  # 公众号「服务器配置」的 Token(明文/兼容模式);仅来自环境变量,严禁写入仓库。
  token: ${WECHAT_TOKEN:}
  welcome-reply: "已收下,正在自动整理 ✅ 处理完可在阅读端查看。"
extract:
  # HTTP 抓取正文不足此长度则尝试无头渲染兜底。
  min-content-length: 200
  headless:
    # 默认关闭;开启需安装 Chromium(npx playwright install chromium 或 Playwright CLI)。
    enabled: ${HEADLESS_ENABLED:false}
    timeout-ms: 20000
storage:
  # 长正文落盘根目录;content 超过 threshold-chars 则写文件(名=uuid)、content 列置空、记 content_object_key。
  root-dir: ${STORAGE_ROOT:./data/content}
  threshold-chars: ${STORAGE_THRESHOLD:20000}
